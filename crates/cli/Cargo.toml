[package]
name = "torii-cli"
version = "0.1.0"
edition = "2024"
description = "torii: the operator control plane for the sensei orchestrator"

# lib+bin: the binary is only clap + `dispatch`; the command implementations live in the
# library so an integration test can drive the real `cmd::worker::serve` (and the real
# `cmd::config::push`) rather than a re-implementation of their contracts.
[lib]
name = "torii"
path = "src/lib.rs"

[[bin]]
name = "torii"
path = "src/main.rs"

[dependencies]
orchestrator-core = { package = "sensei-orchestrator-core", git = "https://github.com/sensei-hq/gateway", tag = "v0.10.0" }
orchestrator = { package = "sensei-orchestrator", git = "https://github.com/sensei-hq/gateway", tag = "v0.10.0" }
# The in-memory stores (TORII_BACKEND=memory) and the registry-directory reader. Postgres lives
# in torii-core (torii's tenant-scoped schema), not in the gateway crate.
orchestrator-store = { package = "sensei-orchestrator-store", git = "https://github.com/sensei-hq/gateway", tag = "v0.10.0" }
gateway = { package = "sensei-gateway", git = "https://github.com/sensei-hq/gateway", tag = "v0.10.0" }
kernel = { package = "sensei-kernel", git = "https://github.com/sensei-hq/gateway", tag = "v0.10.0" }
# torii's shared data layer: the catalog GatewayConfig loader the API uses, tenant resolution
# and the tenant-scoped stores (TM-8c). The CLI reads torii's database through it only.
torii-core = { path = "../core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
# The cross-process e2e needs the same gateway/clock doubles the executor's own tests
# use (a gated gateway to force a durable pause, a recording one to count re-spend).
orchestrator = { package = "sensei-orchestrator", git = "https://github.com/sensei-hq/gateway", tag = "v0.10.0", features = ["test-support"] }
