[package]
name = "torii-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
async-trait = "0.1"
# F3 credential vault — vetted AEAD (RustCrypto AES-256-GCM), not hand-rolled.
aes-gcm = "0.10"
base64 = "0.22"
# F3 key hygiene — best-effort zeroization of KEK/DEK/decrypted secrets on drop.
zeroize = "1"
# H2 API-key identity — argon2id hash/verify of high-entropy key secrets (RustCrypto).
argon2 = { version = "0.5", features = ["std"] }
# C4 redaction/DLP (§2 W5) — pattern + entropy secret/PII detection.
regex = "1"
once_cell = "1"
# MIG-1: real package is `sensei-gateway` (v0.4.6); alias to `gateway` so imports stay short.
gateway = { package = "sensei-gateway", git = "https://github.com/sensei-hq/gateway", tag = "v0.4.6" }
# MIG-2 will add `sensei-kernel` (capability traits / AdapterRegistry) when main.rs is migrated.
