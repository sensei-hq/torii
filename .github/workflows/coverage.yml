name: coverage

# Test coverage -> Qlty Cloud. Needs repo secret QLTY_COVERAGE_TOKEN.
# No untrusted github.event.* is used in any run: step (injection-safe).
#
# Five jobs:
#   * rust — torii-gateway via cargo llvm-cov (lcov).
#   * rust-tests — the torii CLI and its crates (torii-cli, torii-core,
#     torii-orchestrator-store, tools): `cargo test`, with NO database. Their
#     Postgres-backed tests are `#[ignore]`d by each crate's build.rs when
#     DATABASE_URL is unset (a `have_database_url` cfg), so this runs every
#     DB-free test — unit, memory-backend and binary-level — and skips, not
#     passes, the rest.
#   * rust-tests-db — the same `cargo test` WITH a database: a supabase/postgres
#     service (the image the local scratch runs), torii's schema + seeds + RLS
#     applied by database/ci/bootstrap.sh (dbd, pinned), DATABASE_URL set — so
#     the Postgres-backed tests (e2e_pg, postgres_backend, the store's
#     conformance/isolation suites, core's stores, the catalog) run instead of
#     being ignored — then the SQL security suite, database/tests/run.sh.
#   * clippy — `cargo clippy --workspace --all-targets -- -D warnings` over EVERY
#     workspace member, the Tauri desktop app included (so it installs the Linux
#     WebKitGTK/GTK system libs Tauri links against). The same command runs in
#     `make clippy` and the .githooks/pre-commit hook.
#   * js   — @torii/core, @torii/ui, @seiki/admin via vitest --coverage (lcov).
#     (@kavach/* resolve from npm now, so the old "link: deps not resolvable in
#     CI" deferral no longer applies. @torii/desktop stays excluded — built and
#     tested separately as a Tauri bundle.)
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false

      # Strip the dev-in-place [patch] (points sensei-* at the local sibling ../gateway,
      # absent in CI) so the build resolves the ONE gateway git ref every sensei-* dependency
      # pins, from the PUBLIC sensei-hq/gateway repo. Cloud/HTTP-only crate -> a plain Rust build.
      - name: Strip dev [patch]
        run: sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview, rustfmt
      # Every commit is rustfmt-clean (.githooks/pre-commit runs the same check locally).
      - name: rustfmt
        run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          workspaces: services/gateway
      - uses: taiki-e/install-action@d88826bbe7e4a8c2cb8e6d0b2a078681e681afe5 # cargo-llvm-cov
      - name: Rust coverage (torii-gateway)
        run: cargo llvm-cov -p torii-gateway --lcov --output-path lcov-rust.info

      - name: Upload to Qlty
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: lcov-rust.info
          strip-prefix: ${{ github.workspace }}/

  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      # Same dev-[patch] strip as the rust job: resolve every sensei-* from the pinned git ref.
      - name: Strip dev [patch]
        run: sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      # No DATABASE_URL on purpose — the DB-gated tests compile to `#[ignore]` (see above).
      - name: Test (torii-cli, torii-core, torii-orchestrator-store, tools — no database)
        run: cargo test -p torii-cli -p torii-core -p torii-orchestrator-store -p tools

  rust-tests-db:
    runs-on: ubuntu-latest
    env:
      # The dbd release torii's schema is applied with (crates.io `dbd-cli`); bootstrap.sh refuses
      # any other version on PATH.
      DBD_VERSION: 0.24.1
      # The service below. supabase_admin is the image's superuser, as on the local scratch.
      DATABASE_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres
    services:
      postgres:
        # Supabase's Postgres image (auth/vault/extension schemas + roles), the same tag the
        # local scratch database runs — a plain postgres image cannot hold torii's schema.
        image: public.ecr.aws/supabase/postgres:17.6.1.143
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # TCP, not the socket: the image's init runs a socket-only server first, so this only
        # passes once init has finished and the real server is listening.
        options: >-
          --health-cmd "pg_isready -U postgres -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      # Same dev-[patch] strip as the rust job: resolve every sensei-* from the pinned git ref.
      - name: Strip dev [patch]
        run: sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Caches ~/.cargo/bin too (cache-bin), so dbd is built once per cache key, not per run.
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - name: Install psql + dbd (pinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          if [ "$(dbd --version 2>/dev/null)" != "dbd $DBD_VERSION" ]; then
            cargo install dbd-cli --version "$DBD_VERSION" --locked
          fi
          dbd --version
      - name: Apply torii's schema, seeds and RLS policies
        run: bash database/ci/bootstrap.sh
      - name: Test (torii-cli, torii-core, torii-orchestrator-store, tools — with the database)
        run: cargo test -p torii-cli -p torii-core -p torii-orchestrator-store -p tools
      - name: SQL security + logic suite
        run: bash database/tests/run.sh

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      # Same dev-[patch] strip as the rust job: resolve every sensei-* from the pinned git ref.
      - name: Strip dev [patch]
        run: sed -i '/^\[patch\./,/^$/d' Cargo.toml
      # The workspace includes the Tauri desktop app (apps/desktop/src-tauri), so linting it
      # needs Tauri's Linux system libraries (WebKitGTK 4.1 + its libsoup-3/JavaScriptCore,
      # GTK 3, librsvg, appindicator, xdo) for the -sys crates' pkg-config probes, and
      # cmake + libclang for llama.cpp, which the app embeds via sensei-gateway's
      # `local-llama-cpp` feature (its build script compiles llama.cpp even under clippy).
      # No frontend build is needed: without the `custom-protocol` feature tauri's
      # generate_context! runs in dev mode (devUrl) and never reads frontendDist.
      - name: Install Tauri + llama.cpp system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake libclang-dev libssl-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
      - name: Clippy (whole workspace, all targets, warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Coverage (@torii/core)
        run: bun run --filter '@torii/core' test:coverage
      - name: Coverage (@torii/ui)
        run: bun run --filter '@torii/ui' test:coverage
      - name: Coverage (@seiki/admin)
        run: bun run --filter '@seiki/admin' test:coverage
      - name: Upload to Qlty
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2.3.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: packages/core/coverage/lcov.info,packages/ui/coverage/lcov.info,apps/admin/coverage/lcov.info
          strip-prefix: ${{ github.workspace }}/
