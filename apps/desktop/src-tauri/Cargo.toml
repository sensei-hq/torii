[package]
name = "app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
e2e-testing = ["dep:tauri-plugin-playwright"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-playwright = { version = "0.2", optional = true }

# In-process inference engine (local plane). Declared against the canonical git source;
# the workspace-root `[patch."https://github.com/sensei-hq/gateway"]` redirects to the
# sibling `../gateway/crates/*` checkout for dev-in-place.
# MIG-1/3 (2026-07-24): `gateway`/`gateway-embedded` were refactored to `sensei-*` @ v0.4.6.
# Per the crate's design, a consumer depends on ONLY `sensei-gateway` (aliased `gateway`) and
# opts into the in-process local wing via the `local-llama-cpp` feature — no direct
# `sensei-local-*` deps. That surfaces `gateway::local::{EmbeddedLlamaAdapter, ChainedResolver,
# ManagedResolver, OllamaResolver}` (in-process llama.cpp GGUF — no daemon).
gateway = { package = "sensei-gateway", git = "https://github.com/sensei-hq/gateway", tag = "v0.5.0", features = ["local-llama-cpp"] }
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
