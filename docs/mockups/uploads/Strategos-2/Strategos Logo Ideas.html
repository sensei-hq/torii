<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strategos · Logo Ideas</title>
<link rel="stylesheet" href="app/zs.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; }
</style>
</head>
<body class="zs">
<div id="root"></div>
<script type="text/babel" src="components/design-canvas.jsx"></script>
<script type="text/babel" src="components/logo-marks.jsx"></script>
<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
const { MARKS, DOLLAR, SHIELD, KEY } = window.StrategosLogoMarks;

/* one artboard per mark: hero mark, lockup, then a small-size legibility strip */
function LogoBoard({ mark }) {
  const M = mark.render;
  return (
    <div style={{
      width: '100%', height: '100%', boxSizing: 'border-box',
      background: 'var(--paper)', display: 'flex', flexDirection: 'column',
      fontFamily: 'var(--font-ui)', color: 'var(--ink)',
    }}>
      {/* hero */}
      <div style={{ flex: 1, display: 'grid', placeItems: 'center', borderBottom: '1px solid var(--paper-edge)' }}>
        <M size={104} />
      </div>
      {/* lockup */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 14, padding: '22px 0', borderBottom: '1px solid var(--paper-edge)' }}>
        <M size={30} />
        <span style={{ fontFamily: 'var(--font-display)', fontSize: 26, letterSpacing: '-0.02em' }}>Strategos</span>
      </div>
      {/* small sizes */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 28, padding: '16px 0 14px' }}>
        <M size={32} />
        <M size={20} />
        <M size={14} />
        <span style={{ width: 1, alignSelf: 'stretch', background: 'var(--paper-edge)' }}></span>
        <span style={{ display: 'grid', placeItems: 'center', width: 40, height: 40, borderRadius: 10, background: 'var(--ink)' }}>
          <M size={22} dark={true} />
        </span>
      </div>
      {/* note */}
      <div style={{ padding: '12px 18px 16px', borderTop: '1px solid var(--paper-edge)' }}>
        <div style={{ fontFamily: 'var(--font-mono)', fontSize: 10, letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--accent)' }}>{mark.tag}</div>
        <div style={{ fontSize: 12.5, color: 'var(--ink-mute)', marginTop: 4, lineHeight: 1.5 }}>{mark.note}</div>
      </div>
    </div>
  );
}

function App() {
  return (
    <DesignCanvas>
      <DCSection id="keyflows" title="Key flows · from your second reference" subtitle="No circles, no icons — just the flow lines converging inside the shield. The bundle reads like a key: routing as access. Three cuts.">
        {KEY.map((m) => (
          <DCArtboard key={m.id} id={m.id} label={m.label} width={330} height={430}>
            <LogoBoard mark={m} />
          </DCArtboard>
        ))}
      </DCSection>
      <DCSection id="shield" title="Shielded spend · from your reference" subtitle="Provider feeds elbowing into a shield that bears the $ — routing governed at the gate. Three cuts.">
        {SHIELD.map((m) => (
          <DCArtboard key={m.id} id={m.id} label={m.label} width={330} height={430}>
            <LogoBoard mark={m} />
          </DCArtboard>
        ))}
      </DCSection>
      <DCSection id="dollar" title="Route $ · the pick, refined" subtitle="The S-route with its arrowhead capping the upper curve, plus a vertical bar — a dollar sign that travels. Three treatments.">
        {DOLLAR.map((m) => (
          <DCArtboard key={m.id} id={m.id} label={m.label} width={330} height={430}>
            <LogoBoard mark={m} />
          </DCArtboard>
        ))}
      </DCSection>
      <DCSection id="marks" title="Strategos · logo marks" subtitle="Derived from solar:routing-2-bold-duotone — waypoint pins, the S-shaped route, the arrowhead. Vermillion rationed; round caps; duotone fills.">
        {MARKS.map((m) => (
          <DCArtboard key={m.id} id={m.id} label={m.label} width={330} height={430}>
            <LogoBoard mark={m} />
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
