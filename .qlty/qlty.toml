config_version = "0"

exclude_patterns = [
  "*_min.*",
  "*-min.*",
  "*.min.*",
  "**/.yarn/**",
  "**/*.d.ts",
  "**/assets/**",
  "**/bower_components/**",
  "**/build/**",
  "**/cache/**",
  "**/config/**",
  "**/db/**",
  "**/deps/**",
  "**/dist/**",
  "**/extern/**",
  "**/external/**",
  "**/generated/**",
  "**/Godeps/**",
  "**/gradlew/**",
  "**/mvnw/**",
  "**/node_modules/**",
  "**/protos/**",
  "**/seed/**",
  "**/target/**",
  "**/templates/**",
  "**/testdata/**",
  "**/vendor/**",
]

test_patterns = [
  "**/test/**",
  "**/spec/**",
  "**/*.test.*",
  "**/*.spec.*",
  "**/*_test.*",
  "**/*_spec.*",
  "**/test_*.*",
  "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true


[[plugin]]
name = "actionlint"

[[plugin]]
name = "clippy"

[[plugin]]
name = "eslint"
package_file = "package.json"
package_filters = ["eslint", "prettier"]

[[plugin]]
name = "hadolint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "prettier"
package_file = "package.json"
package_filters = ["prettier"]

[[plugin]]
name = "radarlint-iac"
mode = "monitor"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "shellcheck"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "zizmor"

# ---------------------------------------------------------------------------
# Security triage (2026-08): accepted, will-not-fix dependency advisories.
#
# Everything below is an informational/unmaintained RustSec advisory or an
# advisory with NO patched release upstream — none are fixable by a version
# bump in this repo. Re-evaluate if the parent dependency moves:
#
#   * gtk-rs GTK3 stack 0.18 (RUSTSEC-2024-0411..0420) + glib unsoundness
#     (RUSTSEC-2024-0429, fix requires glib 0.20 / gtk3-rs 0.19+ which is EOL):
#     reached via tauri-runtime-wry on Linux. gtk3-rs is retired upstream;
#     resolves only with Tauri's GTK4 migration (tauri-apps/tauri#7335,
#     #12048). Desktop-only surface; not compiled into torii-gateway.
#   * unic-* (RUSTSEC-2025-0075/0080/0081/0098/0100): unmaintained, transitive
#     via tauri-utils -> urlpattern.
#   * paste (RUSTSEC-2024-0436), proc-macro-error (RUSTSEC-2024-0370),
#     ttf-parser (RUSTSEC-2026-0192): unmaintained, transitive via
#     image/pulp+rav1e and lopdf font parsing respectively.
#   * rsa Marvin Attack (CVE-2023-49092 / RUSTSEC-2023-0071): no patched
#     version exists upstream. Reached ONLY via sqlx-mysql inside the sqlx
#     facade; the gateway is postgres-only so the crate is feature-gated out
#     of every build target and never ships.
# ---------------------------------------------------------------------------

[[triage]]
match.plugins = ["osv-scanner"]
match.rules = [
  # gtk-rs GTK3 bindings 0.18 stack (unmaintained) + glib unsoundness
  "osv-scanner:RUSTSEC-2024-0411",
  "osv-scanner:RUSTSEC-2024-0412",
  "osv-scanner:RUSTSEC-2024-0413",
  "osv-scanner:RUSTSEC-2024-0414",
  "osv-scanner:RUSTSEC-2024-0415",
  "osv-scanner:RUSTSEC-2024-0416",
  "osv-scanner:RUSTSEC-2024-0417",
  "osv-scanner:RUSTSEC-2024-0418",
  "osv-scanner:RUSTSEC-2024-0419",
  "osv-scanner:RUSTSEC-2024-0420",
  "osv-scanner:RUSTSEC-2024-0429",
  # unic-* family (unmaintained)
  "osv-scanner:RUSTSEC-2025-0075",
  "osv-scanner:RUSTSEC-2025-0080",
  "osv-scanner:RUSTSEC-2025-0081",
  "osv-scanner:RUSTSEC-2025-0098",
  "osv-scanner:RUSTSEC-2025-0100",
  # proc-macro crates (unmaintained)
  "osv-scanner:RUSTSEC-2024-0370",
  "osv-scanner:RUSTSEC-2024-0436",
  # font parsing (unmaintained)
  "osv-scanner:RUSTSEC-2026-0192",
  # no patched release; unused at runtime (sqlx-mysql, postgres-only build)
  "osv-scanner:CVE-2023-49092",
]
set.ignored = true
