project:
  name: strategos
source:
  dialect: postgresql
target:
  supabase:
    url: $DATABASE_URL
    extensions:
      - name: uuid-ossp
        schema: extensions
      - name: vector
        schema: extensions
schemas:
  - core
  - config
  - extensions
  - history
  - public
  - staging
  - migrate
import:
  staging:
    - staging
  options:
    truncate: true
    null_value: ''
  after:
    - import/loader.sql
    - import/seed_rework.sql
dbml:
  exclude:
    schemas:
      - staging
      - migrate
      - extensions
      - history
ignore: []
