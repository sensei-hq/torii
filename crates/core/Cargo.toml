[package]
name = "torii-core"
version = "0.1.0"
edition = "2021"
description = "Torii's shared Rust data layer — the one place the API (services/gateway) and the operator CLI fetch config and state from torii's database (TM-8, #26)"

[lib]
name = "torii_core"

[dependencies]
# One gateway version across torii (TM-8a). Dev resolves via the workspace [patch].
gateway = { package = "sensei-gateway", git = "https://github.com/sensei-hq/gateway", tag = "v0.11.0" }
anyhow = "1"
# AG-18 (#53): the run-event sink (`events`) — `OrchestratorHooks` is an async trait, its
# wire type serializes, and it hands events off over a bounded `tokio::sync::mpsc`.
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
# The tenant-scoped orchestrator stores (TM-7). Renamed: its lib is also called
# `orchestrator_store`, like the gateway's in-memory crate the CLI uses.
tenant-stores = { package = "torii-orchestrator-store", path = "../orchestrator-store" }
orchestrator-core = { package = "sensei-orchestrator-core", git = "https://github.com/sensei-hq/gateway", tag = "v0.11.0" }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
# AG-4 (#33): the gateway's in-memory stores, so `results` is tested DB-free against the same
# traits torii's Postgres stores implement.
orchestrator-store = { package = "sensei-orchestrator-store", git = "https://github.com/sensei-hq/gateway", tag = "v0.11.0" }
