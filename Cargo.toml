[workspace]
members = ["apps/desktop/src-tauri", "crates/cli", "crates/core", "crates/orchestrator-store", "crates/tools", "services/gateway"]
# "services/gateway" added in the Phase 2 plan
resolver = "2"

# Dev-in-place against the sibling engine repo. Production (and CI, which strips this section)
# resolves every `sensei-*` dependency from the ONE gateway git ref they all pin (TM-8a: the API,
# the desktop app, torii-core, the stores and the CLI never mix gateway versions). Patch the real
# package names to the sibling checkout; transitive crates (sensei-cloud-providers/-kokoro) resolve
# via intra-workspace path deps inside ../gateway.
[patch."https://github.com/sensei-hq/gateway"]
sensei-gateway         = { path = "../gateway/crates/gateway" }
sensei-local-engine    = { path = "../gateway/crates/local-engine" }
sensei-local-providers = { path = "../gateway/crates/local-providers" }
sensei-vault           = { path = "../gateway/crates/vault" }  # V5: shared BYOK vault
# TM-7: the orchestrator's persistence traits + the store conformance suite (gateway TM-2/TM-3).
sensei-orchestrator-core    = { path = "../gateway/crates/orchestrator-core" }
sensei-orchestrator-testkit = { path = "../gateway/crates/orchestrator-testkit" }
# TM-8c: the operator CLI (crates/cli) uses the executor and the kernel types directly; they must
# resolve to the SAME sibling checkout as sensei-gateway, or two copies of the kernel types meet.
sensei-orchestrator       = { path = "../gateway/crates/orchestrator" }
sensei-orchestrator-store = { path = "../gateway/crates/orchestrator-store" }
sensei-kernel             = { path = "../gateway/crates/kernel" }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
