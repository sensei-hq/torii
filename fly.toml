# fly.toml — torii-gateway (central Rust/Axum inference gateway).
#
# Lives at the REPO ROOT on purpose: Fly uses the directory holding fly.toml as the Docker
# build context, and this build needs the whole workspace (the Dockerfile COPYs Cargo.toml/
# Cargo.lock/services/apps). Deploy from the repo root — `fly deploy` (no --config needed).
#
# Secrets via `fly secrets set …` (never committed): DATABASE_URL (prod Supabase, sslmode=require),
# PUBLIC_SUPABASE_URL. BYOK-only — set NO provider api-key env vars. The vault KEK is NOT an env
# var in prod: TORII_ENV=prod refuses a raw TORII_KEK (gap #1); seed it into Supabase Vault:
#   select vault.create_secret('<base64-32-bytes>', 'torii_kek');
# See docs/ops/deployment.md → Vault-crate cutover.

app = 'torii-gateway'
primary_region = 'iad'

[build]
  dockerfile = 'services/gateway/Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  TORII_ENV = 'prod'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
