project:
  name: strategos
source:
  dialect: postgresql
target:
  supabase:
    url: $DATABASE_URL
    extensions:
      - name: uuid-ossp
        schema: extensions
      - name: vector
        schema: extensions
schemas:
  - core
  - config
  - extensions
  - history
  - public
  - staging
  - migrate
import:
  staging:
    - staging
  options:
    truncate: true
    null_value: ''
  after:
    # dbd auto-runs the staging.import_*() procedures (dependency-ordered) during `import`, so
    # no manual loader is needed. seed_rework seeds RBAC + budget data that isn't yet expressed
    # as staging import files (TODO: migrate to import files + procs, then drop this too).
    - import/seed_rework.sql
dbml:
  exclude:
    schemas:
      - staging
      - migrate
      - extensions
      - history
ignore: []
