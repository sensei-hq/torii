[package]
name = "tools"
version = "0.1.0"
edition = "2021"
description = "Torii MCP tool runtime — default-deny (role×space) allow-list enforcement, SSRF-filtered egress, sandboxed stdio, fail-closed W5 tool-egress redaction. Consumed by C1 + desktop; enforcement is never in the engine."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
async-trait = "0.1"
tracing = "0.1"
url = "2"
# The DB-backed AllowListResolver is central-plane only; the desktop compiles the invoker
# + transports + egress WITHOUT sqlx (no Postgres on the device).
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "json"], optional = true }

[features]
default = ["db"]
db = ["dep:sqlx"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
