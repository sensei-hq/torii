name: coverage

# Test coverage -> Qlty Cloud for the torii-gateway (Rust). Needs repo secret
# QLTY_COVERAGE_TOKEN. No untrusted github.event.* is used in any run: step (injection-safe).
#
# JS coverage (@torii/core) is deferred: packages/core depends on local `link:` Kavach
# packages (@kavach/sentry, @kavach/adapter-supabase) that aren't resolvable in CI. Re-add a
# JS job once Kavach is published or checked out as a sibling in CI.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Strip the dev-in-place [patch] (points sensei-* at the local sibling ../gateway,
      # absent in CI) so the build resolves the pinned git tag v0.4.6 from the PUBLIC
      # sensei-hq/gateway repo. Cloud/HTTP-only crate -> a plain Rust build.
      - name: Strip dev [patch]
        run: sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/gateway
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Rust coverage (torii-gateway)
        run: cargo llvm-cov -p torii-gateway --lcov --output-path lcov-rust.info

      - name: Upload to Qlty
        uses: qltysh/qlty-action/coverage@v2.3.0
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: lcov-rust.info
          strip-prefix: ${{ github.workspace }}/
