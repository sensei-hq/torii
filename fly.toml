# fly.toml app configuration file generated for torii-gateway on 2026-07-28T15:14:55Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'torii-gateway'
primary_region = 'iad'

[build]
  dockerfile = 'services/gateway/Dockerfile'

[env]
  HOST = '0.0.0.0'
  PORT = '8080'
  TORII_DB_SCHEMA_SOURCE = 'sensei-hq/torii/database@main'
  TORII_ENV = 'prod'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
