[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
e2e-testing = ["dep:tauri-plugin-playwright"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-playwright = { version = "0.2", optional = true }

# In-process inference engine (local plane). Declared against the canonical git source;
# the workspace-root `[patch."https://github.com/sensei-hq/gateway"]` redirects to the
# sibling `../gateway/crates/*` checkout for dev-in-place.
# MIG-1 (2026-07-24): `gateway-embedded` was retired at v0.3.1 → the local wing is now
# `sensei-local-engine` (resolvers/registry) + `sensei-local-providers` (EmbeddedLlamaAdapter,
# in-process llama.cpp — no daemon). `gateway` aliases the real `sensei-gateway` package.
# The `llama-cpp` feature compiles llama.cpp for in-process GGUF chat/embed.
gateway                = { package = "sensei-gateway", git = "https://github.com/sensei-hq/gateway" }
sensei-local-engine    = { git = "https://github.com/sensei-hq/gateway" }
sensei-local-providers = { git = "https://github.com/sensei-hq/gateway", features = ["llama-cpp"] }
tokio            = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
