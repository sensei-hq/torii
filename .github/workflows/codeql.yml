name: CodeQL

# Advanced setup rather than code scanning's "default setup", for one concrete
# reason: default setup CANNOT analyse Rust. Its API rejects the value outright —
#
#   Invalid property /languages/0: `rust` is not a possible value. Must be one of
#   actions, c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift
#
# — so with default setup the crates in this workspace were not scanned at all.
# Only a committed workflow can cover them.
#
# The Rust extractor is buildless: it resolves the crate graph with cargo
# metadata instead of compiling, so this needs no services and no system
# packages. It does mean the manifest has to resolve — see the patch step below.
#
# The only `run:` step here is a constant string. No workflow inputs and no
# github.event.* values are interpolated anywhere; the sole expression is
# matrix.language, defined immediately below.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published query reaches existing code without waiting
    # for the next push. Offset off the hour to miss the :00 scheduling spike.
    - cron: '37 4 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Upload SARIF to the Security tab.
      security-events: write
      # Required by the `actions` pack to read workflow definitions.
      actions: read
      contents: read
    strategy:
      # One language failing must not hide the others.
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Nothing here needs git auth after checkout, so persisting the token
          # only risks leaking it into artifacts.
          persist-credentials: false
      # Cargo.toml patches four crates to ../gateway/crates/*, sibling paths that
      # only exist on a developer's machine. cargo metadata fails outright on an
      # unresolvable patch, and the Rust extractor runs cargo metadata — so the
      # table is dropped for analysis, exactly as coverage.yml already does for
      # its own build. Source is untouched; only the patch table goes, and the
      # crates then resolve from their git source as they do for consumers.
      - name: drop the local [patch] table (rust only)
        if: matrix.language == 'rust'
        run: sed -i '/^\[patch\./,/^$/d' Cargo.toml
      - name: initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
      - name: autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
      - name: analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: /language:${{ matrix.language }}
