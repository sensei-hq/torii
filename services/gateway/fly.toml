# Fly.io deployment for the torii-gateway (central Rust/Axum inference gateway).
# See docs/ops/deployment.md. Secrets (DATABASE_URL, PUBLIC_SUPABASE_URL, BYOK provider keys)
# are set with `fly secrets set …` — never committed. The vault KEK is NOT an env secret in
# prod: under TORII_ENV=prod a raw TORII_KEK is refused (gap #1); the KEK is read from Supabase
# Vault (secret name TORII_KEK_VAULT_SECRET, default `torii_kek`). See deployment.md → Vault-crate cutover.
#
# Deploy FROM THE REPO ROOT so the Docker build context is the whole workspace:
#   cd <repo-root> && fly deploy --config services/gateway/fly.toml
app = "torii-gateway"
primary_region = "iad"   # pick one near your users + Supabase project region

[build]
  # Relative to the build context (the repo root — see the deploy command above).
  dockerfile = "services/gateway/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  TORII_ENV = "prod"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # scale-to-zero when idle; wakes on request
  auto_start_machines = true
  min_machines_running = 0

  # The gateway streams (/v1/chat/stream, SSE) — do not buffer responses.
  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
