[install]
linkWorkspacePackages = true
# Supply-chain guard: refuse third-party packages published < 7 days ago. Our own first-party
# kavach packages are exempt (exact names — bun doesn't glob here) — we trust our own fresh
# releases, and the gate would otherwise block a just-published version locally AND in CI.
# (rokkit isn't listed: 1.3.6 is already older than the window.)
minimumReleaseAge = 604800
minimumReleaseAgeExcludes = [
  "kavach",
  "@kavach/cli",
  "@kavach/cookie",
  "@kavach/hashing",
  "@kavach/logger",
  "@kavach/query",
  "@kavach/sentry",
  "@kavach/ui",
  "@kavach/vite",
  "@kavach/adapter-supabase",
]
